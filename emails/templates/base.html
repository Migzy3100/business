<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{title}}</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background: #f3f6fb;
                margin: 0;
                padding: 20px;
                color: #1f2937;
            }
            .wrapper {
                max-width: 620px;
                margin: 0 auto;
                background: #fff;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            }
            .header {
                background: linear-gradient(135deg, #0f4c81, #1e6bb8);
                color: #fff;
                padding: 18px 24px;
                font-size: 18px;
                font-weight: 700;
            }
            .content {
                padding: 24px;
                line-height: 1.6;
            }
            .footer {
                background: #f8fafc;
                padding: 14px 24px;
                font-size: 12px;
                color: #6b7280;
            }
            .btn {
                display: inline-block;
                background: #c9a227;
                color: #fff;
                padding: 10px 16px;
                text-decoration: none;
                border-radius: 8px;
            }
        </style>
    </head>
    <body>
        <div class="wrapper">
            <div class="header">Business Online Application and Renewal System</div>
            <div class="content">{{content}}</div>
            <div class="footer">This message was sent by the Business Online Application and Renewal System for your permit transaction.<br>&copy; {{year}} Government Permit Office. All rights reserved.</div>
        </div>
    </body>
</html>
